[tool.poetry]
name = "amneziawg-manager-cli"
version = "0.1.0"
description = "CLI to manage AmneziaWG clients (add, delete, list) via server config and Amnezia clientsTable"
authors = ["Maksim Boydenko <boidenko.maxim@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "amneziawg_manager_cli" }]

[tool.poetry.dependencies]
python = "^3.12"
cryptography = "^42.0.0"

[tool.poetry.scripts]
amneziawg-manager-cli = "amneziawg_manager_cli.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
