[tool.poetry]
name = "amneziawg-manager"
version = "0.1.0"
description = "CLI to manage AmneziaWG clients (add, delete, list) via server config and Amnezia clientsTable"
authors = ["Maksim Boydenko <boidenko.maxim@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "amneziawg_manager" }]

[tool.poetry.dependencies]
python = "^3.12"
cryptography = "^42.0.0"
pydantic = "^2.13.4"
pytest-mock = "^3.15.1"
loguru = "^0.7.3"

[tool.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
